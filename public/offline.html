<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101d2b">
  <title>Koneksi terputus · FORMA</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.25rem; background: #101d2b; color: #edf4f9; font: 1rem/1.55 system-ui, sans-serif }
    main { width: min(100%, 29rem); background: #162837; border: 1px solid #345064; border-radius: 1rem; padding: clamp(1.2rem, 6vw, 2rem) }
    .brand { color: #8be2bb; font-weight: 800; letter-spacing: .14em }
    h1 { margin: .55rem 0; line-height: 1.15 }
    p { color: #bed0df }
    button { padding: .7rem 1rem; margin: .5rem .5rem .25rem 0; min-height: 44px; border: 0; border-radius: .65rem; background: #8be2bb; color: #101d2b; font: inherit; font-weight: 700; cursor: pointer }
    a { color: #8be2bb }
    :focus-visible { outline: 2px solid #fff; outline-offset: 3px }
  </style>
</head>
<body>
  <main>
    <div class="brand">FORMA</div>
    <h1>Koneksi terputus</h1>
    <p>Aktifkan internet untuk membuka jurnal, latihan, dan menyimpan catatan.</p>
    <button type="button" id="retry">Coba lagi</button>
    <a href="/beranda">Ke Beranda</a>
  </main>
  <script>document.getElementById("retry").addEventListener("click", () => location.reload());</script>
</body>
</html>
